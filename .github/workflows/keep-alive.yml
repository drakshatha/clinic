name: Keep DB Warm

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health + warm homepage
        run: |
          curl -sf https://drakshatha.in/api/health || true
          curl -sf https://drakshatha.in/ -o /dev/null || true
